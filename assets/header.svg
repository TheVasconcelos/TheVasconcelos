<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 168" width="880" height="168" role="img" aria-label="TheVasconcelos, Software Project Manager" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg    { fill: #fbfbfa; }
    .name  { fill: #16150f; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .role  { fill: #16150f; opacity: .62; font-family: ui-monospace, Menlo, monospace; }
    .rule  { stroke: #16150f; opacity: .16; stroke-width: 1; }
    .teal  { fill: #0F6E56; }
    .tealS { stroke: #0F6E56; stroke-width: 1.4; fill: none; }
    .frame { stroke: #16150f; opacity: .22; stroke-width: 1; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .name  { fill: #f2f0ec; }
      .role  { fill: #f2f0ec; opacity: .55; }
      .rule  { stroke: #f2f0ec; opacity: .18; }
      .teal  { fill: #5DCAA5; }
      .tealS { stroke: #5DCAA5; }
      .frame { stroke: #f2f0ec; opacity: .18; }
    }
    .sweep { animation: sw 7s ease-in-out infinite; }
    @keyframes sw { 0%,100% { opacity:.30 } 50% { opacity:.85 } }
    .step { animation: st 6s ease-in-out infinite; }
    @keyframes st { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
  </style>

  <rect class="bg" width="880" height="168"/>

  <g class="step">
    <rect class="teal" x="712" y="104" width="9" height="18" rx="1.5" opacity=".35"/>
    <rect class="teal" x="729" y="92"  width="9" height="30" rx="1.5" opacity=".5"/>
    <rect class="teal" x="746" y="76"  width="9" height="46" rx="1.5" opacity=".7"/>
    <rect class="teal" x="763" y="56"  width="9" height="66" rx="1.5"/>
  </g>
  <path class="tealS sweep" d="M700 122 L788 122"/>

  <text class="name" x="56" y="76" font-size="27" letter-spacing="2.5">TheVasconcelos</text>
  <path class="tealS" d="M56 94 l34 0"/>
  <text class="role" x="56" y="118" font-size="11.5" letter-spacing="2.4">SOFTWARE PROJECT MANAGER · MEDICAL DEVICES · EU MDR</text>

  <path class="rule" d="M56 140 L824 140"/>
  <rect class="frame" x=".6" y=".6" width="878.8" height="166.8"/>
</svg>
